<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Marketwins</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#060606">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <style>
    @font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/outfit-latin-var.woff2') format('woff2')}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#060606;color:#e8e8e8;font-family:'Outfit',system-ui,sans-serif;text-align:center;padding:2rem}
    .wrap{max-width:520px}
    .code{font-size:clamp(4rem,14vw,7rem);font-weight:700;line-height:1;background:linear-gradient(135deg,#f4e4b5,#d4af37,#b8941f);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{color:#fff;font-size:1.5rem;font-weight:700;margin:1rem 0 .6rem}
    p{color:#9a9a9a;line-height:1.7;margin-bottom:2rem}
    .actions{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}
    a.btn{display:inline-block;padding:.75rem 1.7rem;border-radius:100px;font-size:.95rem;text-decoration:none;transition:transform .2s,box-shadow .2s}
    a.gold{background:linear-gradient(135deg,#d4af37,#b8941f);color:#0a0a0a;font-weight:700}
    a.gold:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(212,175,55,.35)}
    a.ghost{border:1px solid rgba(212,175,55,.45);color:#d4af37}
    a.ghost:hover{border-color:#d4af37}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Cette page n'existe pas (ou plus)</h1>
    <p>Le lien que vous avez suivi est peut-être obsolète. Retrouvez nos services d'acquisition payante et nos conseils sur le blog.</p>
    <div class="actions">
      <a class="btn gold" href="/">Retour à l'accueil</a>
      <a class="btn ghost" href="/blog/">Voir le blog</a>
    </div>
  </div>
</body>
</html>
